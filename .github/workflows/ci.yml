name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev] git+https://github.com/anarkiwi/virtuous-cycles
      - name: Format
        run: black --check wayward_eagle tests
      - name: Lint
        run: pylint wayward_eagle tests
      - name: Test
        run: pytest tests -n auto --cov=wayward_eagle --cov-fail-under=85
