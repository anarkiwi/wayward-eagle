[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wayward-eagle"
version = "0.5.10"
description = "Lower the cognitive complexity of C function bodies, keeping what they do, and census C readability defects"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Josh Bailey" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "clang-format==23.1.5",
    "clang-tidy==23.1.4",
    "orjson==3.13.0",
    "pycparser==3.12",
    "pyyaml==6.0.4",
    "tqdm>=4",
    "ziglang==0.17.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "pytest-cov", "black", "pylint", "pysayme>=0.4.0"]

[project.scripts]
wayward-eagle = "wayward_eagle.cli:main"

[project.entry-points."virtuous_cycles.adapters"]
wayward-census = "wayward_eagle.adapter:adapter"

[project.urls]
Repository = "https://github.com/anarkiwi/wayward-eagle"

[tool.setuptools]
packages = ["wayward_eagle", "wayward_eagle.c"]

[tool.black]
line-length = 100

[tool.pylint.main]
extension-pkg-allow-list = ["orjson"]

[tool.pylint.format]
max-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

# Code here must not duplicate code its dependencies already export (pysayme). A key in
# `allow` is a deliberate duplicate; its value says why.
[tool.pysayme]
roots = ["wayward_eagle", "tests", "tools"]
ignore-dists = ["pytest", "pytest-xdist", "pytest-cov", "black", "pylint", "pysayme"]

[tool.pysayme.allow]
"tests/test_census.py:test_class_absent -> tests/test_census.py:test_class_found" = "one case table read for its defect and for its fix: the two halves of each class's test"
"tests/test_census.py:test_duplicate_code_ignores_names_of_its_own_locals -> tests/test_census.py:test_duplicate_code_leaves_tail_calls" = "separate duplicate-code cases sharing the census call"
"wayward_eagle/c/printer.py:Generator.visit_AttributeSpecifier -> pycparser.c_generator:CGenerator.visit_AttributeSpecifier" = "an override: pycparser's spells C23's [[a, b]], clang's AST and this printer GNU __attribute__((a, b))"
