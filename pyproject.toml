[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wayward-eagle"
version = "0.4.0"
description = "Lower the cognitive complexity of C function bodies, keeping what they do, and census C readability defects"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Josh Bailey" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "clang-format==23.1.5",
    "clang-tidy==23.1.4",
    "orjson==3.13.0",
    "pycparser==3.12",
    "tqdm>=4",
    "ziglang==0.17.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "pytest-cov", "black", "pylint"]

[project.scripts]
wayward-eagle = "wayward_eagle.cli:main"

[project.entry-points."virtuous_cycles.adapters"]
wayward-census = "wayward_eagle.census:adapter"

[project.urls]
Repository = "https://github.com/anarkiwi/wayward-eagle"

[tool.setuptools]
packages = ["wayward_eagle", "wayward_eagle.c"]

[tool.black]
line-length = 100

[tool.pylint.main]
extension-pkg-allow-list = ["orjson"]

[tool.pylint.format]
max-line-length = 100
